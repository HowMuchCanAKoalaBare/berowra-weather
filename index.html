    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
    .glass { 
      background: rgba(15, 23, 42, 0.82); 
      backdrop-filter: blur(20px); 
      -webkit-backdrop-filter: blur(20px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .hero-gradient { background: linear-gradient(90deg, #0ea5e9 0%, #f59e0b 100%); }

    .icon-square { width: 46px; height: 46px; }
    .chart-wrap { position: relative; height: 180px; }
    @media (min-width: 640px) { .chart-wrap { height: 200px; } }
    @media (min-width: 1024px) { .chart-wrap { height: 220px; } }
    @media (min-width: 1280px) { .chart-wrap { height: 240px; } }
    .chart-container { width: 100% !important; height: 100% !important; display: block; }
    .forecast-card { transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    .glass-hover { 
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), 
                  border-color 0.2s ease, 
                  background-color 0.2s ease; 
    }
    .glass-hover:hover { 
      transform: translateY(-1px); 
      border-color: rgba(255, 255, 255, 0.13); 
      background: rgba(15, 23, 42, 0.88);
    }
    .spin { animation: spin 0.9s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* Lightweight skeleton for first-load experience */
    .skeleton {
      position: relative;
      overflow: hidden;
      border-radius: 9999px;
    }
    .skeleton::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(148,163,184,0.12), transparent);
      animation: skeleton-shimmer 1.35s infinite linear;
      pointer-events: none;
    }
    @keyframes skeleton-shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .skeleton-text {
      background: rgba(148,163,184,0.18);
      border-radius: 4px;
      display: inline-block;
    }

    .sparkline { display: block; opacity: 0.9; }
    .sparkline line { stroke: #64748b; stroke-opacity: 0.3; }

    .metric-value { font-variant-numeric: tabular-nums; }
    .section-header { 
      font-size: 0.875rem; 
      font-weight: 500; 
      letter-spacing: 0.5px;
      color: #cbd5e1;
    }

    /* NEW: Glass metric alignment system */
    .glass-metric {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      min-height: 138px;
    }
    .glass-metric .content {
      flex: 1;
      min-width: 0;
      text-align: left;
    }
    .glass-metric .value {
      font-size: 2.25rem;
      line-height: 1.05;
    }
    .glass-metric .label {
      letter-spacing: 1.5px;
      font-weight: 500;
    }
    .glass-metric .subtext {
      font-size: 0.75rem;
      line-height: 1.25;
      color: rgb(148 163 184);
    }

    /* Respect reduced motion preference */
    @media (prefers-reduced-motion: reduce) {
      .glass-hover, .compass, .forecast-card {
        transition: none !important;
      }
      .spin, .skeleton::after {
        animation: none !important;
      }
      .glass-hover:hover {
        transform: none;
      }
    }
  </style>
</head>
